<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EXIF Frame</title>
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EXIF Frame">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>EXIF Frame</h1>
    <div class="topbar-actions">
      <button class="btn ghost" id="install">Instalar</button>
      <label class="btn ghost" for="file">Abrir foto</label>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <div class="drop" id="drop">
        <svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true"><path fill="currentColor" d="M4 5h3l2-2h6l2 2h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"/></svg>
        <p><strong>Toca para elegir una foto</strong><br>o arrástrala aquí</p>
        <p class="formats">JPG · PNG · HEIC · WebP · AVIF · TIFF · RAW</p>
        <input type="file" id="file" accept="image/*">
      </div>
      <div class="status" id="status" hidden></div>
      <canvas id="canvas" hidden></canvas>
    </section>

    <aside class="panel" id="panel" hidden>
      <h2>Estilo</h2>
      <div class="templates" id="templates"></div>

      <h2>Logo</h2>
      <label class="field"><select id="f-logo"></select></label>

      <h2>Datos</h2>
      <label class="field">Cámara <input id="f-camera" type="text"></label>
      <label class="field">Lente <input id="f-lens" type="text"></label>
      <label class="field">Ajustes <input id="f-settings" type="text"></label>
      <label class="field">Fecha <input id="f-date" type="text"></label>
      <label class="field">Firma <input id="f-author" type="text" placeholder="Tu nombre (opcional)"></label>

      <div class="actions">
        <button class="btn primary" id="save">Guardar / Compartir</button>
      </div>
    </aside>
  </main>

  <dialog class="install-help" id="install-help">
    <h2>Instalar EXIF Frame</h2>
    <ol id="install-steps"></ol>
    <form method="dialog"><button class="btn primary">Entendido</button></form>
  </dialog>

  <script src="decoders.js"></script>
  <script src="logos.js"></script>
  <script src="render.js"></script>
  <script src="app.js"></script>
</body>
</html>
